<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Connexion | Gestion Dettes Premium</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body {
            background-color: #1e293b;
        }
        .login-card {
            background-color: #0f172a;
            border-radius: 32px;
            border: 1px solid rgba(34, 211, 238, 0.15);
        }
        .input-icon {
            position: relative;
        }
        .input-icon i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #22d3ee;
            font-size: 18px;
        }
        .input-icon input {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 28px;
            padding: 14px 16px 14px 48px;
            color: white;
            font-size: 16px;
            width: 100%;
            transition: all 0.2s;
        }
        .input-icon input:focus {
            outline: none;
            border-color: #22d3ee;
            box-shadow: 0 0 0 3px rgba(34, 211, 238, 0.2);
            background-color: #1e293b;
        }
        .input-icon input::placeholder {
            color: #64748b;
        }
        .btn-login {
            background: linear-gradient(135deg, #22d3ee 0%, #06b6d4 100%);
            border: none;
            border-radius: 40px;
            padding: 14px;
            font-weight: 600;
            font-size: 16px;
            color: #0f172a;
            transition: all 0.2s;
            width: 100%;
        }
        .btn-login:active {
            transform: scale(0.97);
        }
        .error-alert {
            background-color: rgba(220, 38, 38, 0.15);
            border: 1px solid rgba(220, 38, 38, 0.3);
            border-radius: 20px;
            color: #f87171;
            font-size: 14px;
            padding: 12px 16px;
        }
        .brand-icon {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, rgba(34, 211, 238, 0.15) 0%, rgba(34, 211, 238, 0.05) 100%);
            border-radius: 35px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px auto;
        }
    </style>
</head>
<body class="bg-dark" style="background-color: #1e293b !important;">

    <!-- Conteneur principal mobile-first -->
    <div class="container-fluid px-0" style="max-width: 500px; margin: 0 auto; background-color: #1e293b; min-height: 100vh;">
        
        <!-- Espacement haut pour centrer verticalement -->
        <div class="d-flex flex-column justify-content-center min-vh-100 px-4 py-5">
            
            <!-- Logo / Icône brand -->
            <div class="text-center mb-4">
                <div class="brand-icon mx-auto">
                    <i class="fas fa-store text-info fs-1"></i>
                </div>
                <h1 class="text-white fw-bold mt-3 mb-2" style="font-size: 28px;">Gestion Dettes</h1>
                <p class="text-secondary small">Magasin d'alimentation premium</p>
            </div>

            <!-- Carte de connexion -->
            <div class="login-card p-4 shadow-lg">
                <div class="text-center mb-4">
                    <i class="fas fa-lock text-info fs-4 mb-2"></i>
                    <h3 class="text-white fw-semibold mb-1">Connexion</h3>
                    <p class="text-secondary small">Accédez à votre espace sécurisé</p>
                </div>

                <!-- Formulaire -->
                <form method="post">
                    <!-- Champ Nom -->
                    <div class="mb-3 input-icon">
                        <i class="fas fa-user"></i>
                        <input type="text" name="nom" placeholder="Nom d'utilisateur" required>
                    </div>

                    <!-- Champ Mot de passe -->
                    <div class="mb-4 input-icon">
                        <i class="fas fa-lock"></i>
                        <input type="password" name="mdp" placeholder="Mot de passe" required>
                    </div>

                    <!-- Bouton connexion -->
                    <button type="submit" class="btn-login">
                        <i class="fas fa-arrow-right-to-bracket me-2"></i> Se Connecter
                    </button>
                </form>

                <!-- Affichage erreur -->
                {% if erreur %}
                <div class="error-alert mt-4 d-flex align-items-center gap-2">
                    <i class="fas fa-exclamation-triangle"></i>
                    <span>{{ erreur }}</span>
                </div>
                {% endif %}

                <!-- Lien d'aide (optionnel) -->
                <div class="text-center mt-4">
                    <small class="text-secondary">
                        <i class="fas fa-shield-alt me-1 text-info"></i> Connexion sécurisée
                    </small>
                </div>
            </div>

            <!-- Footer -->
            <div class="text-center text-secondary small py-4 mt-4">
                <i class="fas fa-lock me-1"></i> Paiements sécurisés 
                <i class="fas fa-circle mx-1" style="font-size: 4px; vertical-align: middle;"></i> 
                AppDette
                <i class="fas fa-circle mx-1" style="font-size: 4px; vertical-align: middle;"></i> 
                
            </div>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='bootstrap/js/bootstrap.bundle.min.js') }}"></script>
</body>
</html>
