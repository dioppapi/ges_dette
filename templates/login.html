<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion | Gestion Dettes</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="app">
        <div class="login-wrapper">
            <div class="form-card">
                <div class="icon-circle">
                    <i class="fas fa-store"></i>
                </div>
                <h2>Gestion Dettes</h2>
                <p class="subtitle">Magasin d'alimentation premium</p>

                <form method="post" class="login-form">
                    <div class="form-group">
                        <label class="form-label"><i class="fas fa-user"></i> Nom d'utilisateur</label>
                        <input type="text" name="nom" class="form-control" placeholder="Entrez votre nom" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label"><i class="fas fa-lock"></i> Mot de passe</label>
                        <input type="password" name="mdp" class="form-control" placeholder="Entrez votre mot de passe" required>
                    </div>

                    <button type="submit" class="btn-primary btn-full">
                        <i class="fas fa-arrow-right-to-bracket"></i> Se Connecter
                    </button>
                </form>

                {% if erreur %}
                <div class="alert alert-error">
                    <i class="fas fa-exclamation-triangle"></i>
                    {{ erreur }}
                </div>
                {% endif %}

                <div class="footer" style="border: none; margin-top: 20px;">
                    <i class="fas fa-shield-alt"></i> Connexion sécurisée
                </div>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div id="toast" class="toast">
        <i class="fas fa-info-circle"></i>
        <span id="toastMessage">Message</span>
    </div>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
