<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ajouter Dette | Gestion Dettes</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>
    <div class="app form-page">
        <!-- Header -->
        <header class="header">
            <div class="header-left">
                <a href="{{ url_for('index') }}" class="back-btn"><i class="fas fa-arrow-left"></i></a>
                <h1 class="title-sm">Ajouter Dette</h1>
            </div>
        </header>

        <!-- Formulaire -->
        <main>
            <div class="form-card">
                <div class="icon-circle">
                    <i class="fas fa-file-invoice-dollar"></i>
                </div>
                <h2>Nouvelle Dette</h2>
                <p class="subtitle">Enregistrer un crédit client</p>

                {% if erreur %}
                <div class="alert alert-error">
                    <i class="fas fa-exclamation-triangle"></i>
                    {{ erreur }}
                </div>
                {% endif %}

                <form method="post">
                    <div class="form-group">
                        <label class="form-label"><i class="fas fa-user"></i> Client</label>
                        <select name="id_client" class="form-select" required>
                            <option disabled selected>📋 Sélectionnez un client</option>
                            {% for client in clients %}
                            <option value="{{ client.id_client }}">{{ client.nom }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="form-group">
                        <label class="form-label"><i class="fas fa-pen"></i> Description</label>
                        <input type="text" name="description" class="form-control"
                            placeholder="Ex: Riz, huile, sucre..." required>
                    </div>

                    <div class="form-group">
                        <label class="form-label"><i class="fas fa-coins"></i> Montant (UM)</label>
                        <input type="number" step="1" min="1" name="montant" class="form-control" inputmode="numeric"
                            placeholder="montant" required>
                    </div>

                    <button type="submit" class="btn-primary btn-full">
                        <i class="fas fa-save"></i> Enregistrer la dette
                    </button>
                </form>

                
            </div>
        </main>

        <footer class="footer">
            <i class="fas fa-lock"></i> Sécurisé <span class="dot">•</span> NexusDette v2.0
        </footer>
    </div>

    <!-- Popups -->
    {% include 'includes/popups.html' %}

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>

</html>
