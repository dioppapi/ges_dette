<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Demande de paiement | Gestion Dettes</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        /* ============================================
           DEMANDE PAIEMENT - STYLES SPÉCIFIQUES
           ============================================ */

        .debt-summary {
            background: var(--bg-card);
            border-radius: var(--radius-sm);
            padding: 16px 20px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.03);
        }

        .debt-summary .label {
            font-size: 12px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .debt-summary .description {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-primary);
            margin: 4px 0 8px;
        }

        .debt-summary .restant {
            font-size: 28px;
            font-weight: 700;
            color: var(--warning);
        }

        .debt-summary .restant.zero {
            color: var(--success);
        }

        .debt-summary .restant-label {
            font-size: 13px;
            color: var(--text-secondary);
        }

        /* Formulaire */
        .form-card {
            background: var(--bg-card);
            border-radius: var(--radius-sm);
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.03);
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group .form-label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }

        .form-group .form-label i {
            color: var(--accent);
            margin-right: 6px;
        }

        .form-group .form-control {
            width: 100%;
            padding: 14px 16px;
            background: var(--bg-primary);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 16px;
            transition: var(--transition);
            outline: none;
        }

        .form-group .form-control:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        .form-group .form-control::placeholder {
            color: var(--text-muted);
        }

        .form-group .form-hint {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 6px;
        }

        .form-group .form-hint i {
            margin-right: 4px;
        }

        /* Boutons de méthode de paiement */
        .payment-methods {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 18px;
        }

        .payment-method-btn {
            background: var(--bg-primary);
            border: 2px solid rgba(255, 255, 255, 0.06);
            border-radius: 12px;
            padding: 14px 12px;
            text-align: center;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .payment-method-btn:active {
            transform: scale(0.96);
        }

        .payment-method-btn .icon {
            font-size: 24px;
        }

        .payment-method-btn .label {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
        }

        .payment-method-btn.active {
            border-color: var(--accent);
            background: var(--accent-glow);
        }

        .payment-method-btn.active .label {
            color: var(--accent);
        }

        .payment-method-btn.cash .icon {
            color: var(--success);
        }

        .payment-method-btn.mobile .icon {
            color: var(--accent);
        }

        /* Sélecteur d'application mobile */
        .app-selector {
            display: none;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
            margin-bottom: 18px;
        }

        .app-selector.show {
            display: grid;
        }

        .app-btn {
            background: var(--bg-primary);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 10px;
            padding: 12px 8px;
            text-align: center;
            cursor: pointer;
            transition: var(--transition);
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
        }

        .app-btn:active {
            transform: scale(0.96);
        }

        .app-btn .icon {
            font-size: 20px;
            display: block;
            margin-bottom: 4px;
        }

        .app-btn.active {
            border-color: var(--accent);
            background: var(--accent-glow);
            color: var(--accent);
        }

        /* Bouton soumettre */
        .btn-submit {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent-hover) 100%);
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            color: var(--bg-primary);
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-submit:active {
            transform: scale(0.97);
        }

        .btn-submit:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Alertes */
        .alert {
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 16px;
        }

        .alert-error {
            background: var(--danger-glow);
            border: 1px solid rgba(239, 68, 68, 0.2);
            color: #f87171;
        }

        .alert-success {
            background: var(--success-glow);
            border: 1px solid rgba(34, 197, 94, 0.2);
            color: #4ade80;
        }

        .alert-info {
            background: var(--accent-glow);
            border: 1px solid rgba(34, 211, 238, 0.2);
            color: var(--accent);
        }

        /* TOAST */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: var(--bg-card);
            color: var(--text-primary);
            padding: 12px 24px;
            border-radius: var(--radius-xs);
            border: 1px solid rgba(34, 211, 238, 0.12);
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.4);
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            font-weight: 500;
            opacity: 0;
            visibility: hidden;
            transition: all 0.35s ease;
            z-index: 2000;
            max-width: 90%;
        }

        .toast i {
            color: var(--success);
            font-size: 18px;
        }

        .toast.show {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) translateY(0);
        }

        /* POPUP */
        .popup-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 10, 25, 0.85);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            padding: 20px;
        }

        .popup-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .popup-card {
            background: var(--bg-card);
            border-radius: 28px;
            max-width: 400px;
            width: 100%;
            padding: 28px 24px;
            border: 1px solid rgba(34, 211, 238, 0.06);
            box-shadow: 0 24px 48px rgba(0, 0, 0, 0.5);
            animation: popupIn 0.3s ease;
        }

        @keyframes popupIn {
            from {
                opacity: 0;
                transform: scale(0.95) translateY(20px);
            }

            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .popup-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .popup-header h3 {
            font-size: 20px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .popup-header h3 i {
            color: var(--accent);
            margin-right: 8px;
        }

        .popup-close {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 20px;
            cursor: pointer;
            padding: 4px 8px;
            transition: var(--transition);
        }

        .popup-body {
            color: var(--text-secondary);
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .popup-footer {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
        }

        .popup-footer .btn-secondary {
            background: transparent;
            border: 1px solid #334155;
            border-radius: var(--radius-xs);
            padding: 10px 24px;
            color: var(--text-secondary);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
        }

        .popup-footer .btn-secondary:active {
            transform: scale(0.97);
            background: rgba(255, 255, 255, 0.04);
        }

        .popup-footer .btn-primary {
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent-hover) 100%);
            border: none;
            border-radius: var(--radius-xs);
            padding: 10px 24px;
            font-size: 14px;
            font-weight: 600;
            color: var(--bg-primary);
            cursor: pointer;
            transition: var(--transition);
        }

        .popup-footer .btn-primary:active {
            transform: scale(0.97);
        }

        /* RESPONSIVE */
        @media (max-width: 400px) {
            .payment-methods {
                grid-template-columns: 1fr 1fr;
            }

            .app-selector {
                grid-template-columns: 1fr 1fr 1fr;
            }

            .app-btn {
                font-size: 12px;
                padding: 10px 6px;
            }

            .debt-summary .restant {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>
    <div class="app">

        <!-- ============================================ -->
        <!-- HEADER -->
        <!-- ============================================ -->
        <header class="header">
            <div class="header-left">
                <a href="{{ url_for('liste_dette') }}" class="back-btn"><i class="fas fa-arrow-left"></i></a>
                <h1 class="title-sm">Paiement</h1>
            </div>
        </header>

        <!-- ============================================ -->
        <!-- CONTENT -->
        <!-- ============================================ -->
        <main>

            <!-- Résumé de la dette -->
            <div class="debt-summary">
                <div class="label">Dette</div>
                <div class="description">{{ dette.description }}</div>
                <div>
                    <span class="restant-label">Restant à payer : </span>
                    <span class="restant {% if dette.montant_rest == 0 %}zero{% endif %}">
                        {{ dette.montant_rest }} UM
                    </span>
                </div>
            </div>

            <!-- Message d'erreur -->
            {% if erreur %}
            <div class="alert alert-error">
                <i class="fas fa-exclamation-triangle"></i>
                {{ erreur }}
            </div>
            {% endif %}

            <!-- Formulaire -->
            <div class="form-card">

                <form method="post" id="paymentForm">

                    <!-- Méthode de paiement -->
                    <div class="form-group">
                        <label class="form-label"><i class="fas fa-hand-holding-usd"></i> Méthode de paiement</label>

                        <div class="payment-methods">
                            <button type="button" class="payment-method-btn cash active" onclick="selectMethod('cash')">
                                <span class="icon">💵</span>
                                <span class="label">Espèces</span>
                            </button>
                            <button type="button" class="payment-method-btn mobile" onclick="selectMethod('mobile')">
                                <span class="icon">📱</span>
                                <span class="label">Mobile</span>
                            </button>
                        </div>

                        <!-- Sélecteur d'application mobile -->
                        <div class="app-selector" id="appSelector">
                            <button type="button" class="app-btn" onclick="selectApp('Bankily')">
                                <span class="icon">🏦</span>
                                Bankily
                            </button>
                            <button type="button" class="app-btn" onclick="selectApp('Masrivi')">
                                <span class="icon">🏦</span>
                                Masrivi
                            </button>
                            <button type="button" class="app-btn" onclick="selectApp('Sedad')">
                                <span class="icon">🏦</span>
                                Sedad
                            </button>
                        </div>

                        <!-- Champ caché pour la méthode -->
                        <input type="hidden" name="description" id="methodInput" value="Espèces">
                    </div>

                    <!-- Montant -->
                    <div class="form-group">
                        <label class="form-label"><i class="fas fa-coins"></i> Montant à payer</label>
                        <input type="number" step="1" min="1" name="montant" class="form-control" inputmode="numeric"
                            placeholder="Montant à payer" required>
                        <div class="form-hint">
                            <i class="fas fa-info-circle"></i> Maximum : {{ dette.montant_rest }} UM
                        </div>
                    </div>

                    <!-- Message pour paiement mobile -->
                    <div class="alert alert-info" id="mobileInfo" style="display:none;">
                        <i class="fas fa-clock"></i>
                        Le paiement sera en attente jusqu'à confirmation de réception
                    </div>

                    <!-- Bouton -->
                    <button type="submit" class="btn-submit" id="submitBtn">
                        <i class="fas fa-paper-plane"></i> Envoyer la demande
                    </button>

                </form>

            </div>

        </main>

        <!-- Footer -->
        <footer class="footer">
            <i class="fas fa-lock"></i> Sécurisé <span class="dot">•</span> NexusDette v2.0
        </footer>

    </div>

    <!-- ============================================ -->
    <!-- TOAST -->
    <!-- ============================================ -->
    <div id="toast" class="toast">
        <i class="fas fa-check-circle"></i>
        <span id="toastMessage">Message</span>
    </div>

    <!-- ============================================ -->
    <!-- SCRIPTS -->
    <!-- ============================================ -->
    <script>
        // ============================================
        // GESTION DES MÉTHODES DE PAIEMENT
        // ============================================
        let selectedMethod = 'cash';
        let selectedApp = '';

        function selectMethod(method) {
            selectedMethod = method;

            // Mettre à jour les boutons
            document.querySelectorAll('.payment-method-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            document.querySelector(`.payment-method-btn.${method}`).classList.add('active');

            // Afficher/cacher le sélecteur d'app
            const appSelector = document.getElementById('appSelector');
            const mobileInfo = document.getElementById('mobileInfo');

            if (method === 'mobile') {
                appSelector.classList.add('show');
                mobileInfo.style.display = 'block';
                // Sélectionner la première app par défaut
                if (!selectedApp) {
                    selectApp('Bankily');
                }
            } else {
                appSelector.classList.remove('show');
                mobileInfo.style.display = 'none';
                selectedApp = '';
                document.getElementById('methodInput').value = 'Espèces';
            }
        }

        function selectApp(app) {
            selectedApp = app;

            document.querySelectorAll('.app-btn').forEach(btn => {
                btn.classList.remove('active');
            });

            document.querySelectorAll('.app-btn').forEach(btn => {
                if (btn.textContent.trim() === app) {
                    btn.classList.add('active');
                }
            });

            document.getElementById('methodInput').value = app;
        }

        // ============================================
        // VALIDATION DU FORMULAIRE
        // ============================================
        document.addEventListener('DOMContentLoaded', function () {
            const form = document.getElementById('paymentForm');
            const submitBtn = document.getElementById('submitBtn');
            const montantInput = document.querySelector('input[name="montant"]');
            const maxMontant = {{ dette.montant_rest }
        };

        // Valider le montant en temps réel
        if (montantInput) {
            montantInput.addEventListener('input', function () {
                const value = parseFloat(this.value);
                if (value > maxMontant) {
                    this.style.borderColor = 'var(--danger)';
                    this.style.boxShadow = '0 0 0 3px var(--danger-glow)';
                    submitBtn.disabled = true;
                } else if (value <= 0) {
                    this.style.borderColor = 'var(--danger)';
                    this.style.boxShadow = '0 0 0 3px var(--danger-glow)';
                    submitBtn.disabled = true;
                } else {
                    this.style.borderColor = 'var(--success)';
                    this.style.boxShadow = '0 0 0 3px var(--success-glow)';
                    submitBtn.disabled = false;
                }
            });
        }

        // Validation avant soumission
        form.addEventListener('submit', function (e) {
            const montant = parseFloat(montantInput.value);

            if (isNaN(montant) || montant <= 0) {
                e.preventDefault();
                showToast('❌ Veuillez saisir un montant valide', 'error');
                return false;
            }

            if (montant > maxMontant) {
                e.preventDefault();
                showToast('❌ Le montant dépasse le reste à payer', 'error');
                return false;
            }

            // Vérifier la méthode
            if (selectedMethod === 'mobile' && !selectedApp) {
                e.preventDefault();
                showToast('❌ Veuillez sélectionner une application', 'error');
                return false;
            }

            return true;
        });

        // Initialisation
        selectMethod('cash');
        });

        // ============================================
        // TOAST
        // ============================================
        let toastTimeout = null;

        function showToast(message, type) {
            const toast = document.getElementById('toast');
            const msg = document.getElementById('toastMessage');
            const icon = toast ? toast.querySelector('i') : null;

            if (!toast || !msg) return;

            if (toastTimeout) {
                clearTimeout(toastTimeout);
                toastTimeout = null;
            }

            toast.className = 'toast';
            if (type === 'error') toast.classList.add('error');

            msg.textContent = message;

            if (icon) {
                if (type === 'error') icon.className = 'fas fa-exclamation-circle';
                else icon.className = 'fas fa-check-circle';
            }

            toast.classList.add('show');

            toastTimeout = setTimeout(() => {
                toast.classList.remove('show');
                toastTimeout = null;
            }, 3000);
        }
    </script>

</body>

</html>
